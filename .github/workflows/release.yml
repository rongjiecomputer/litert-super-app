name: Release

# Push a tag like `v1.0.0` to build Windows (x64) + macOS (arm64) and publish
# a GitHub release with both zips attached. "Run workflow" from the Actions tab
# does a build only (artifacts are downloadable from the run, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch LiteRT runtime
        run: python tools/fetch_litert_sdk.py

      - run: flutter pub get
      - run: flutter test

      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath LiteRT-Super-App-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: LiteRT-Super-App-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: macOS (arm64)
    # macos-latest is Apple Silicon, so this produces an arm64 build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch LiteRT runtime
        run: python3 tools/fetch_litert_sdk.py

      - run: flutter pub get
      - run: flutter test

      - run: flutter build macos --release

      - name: Package
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          echo "Packaging: $app"
          # ditto keeps symlinks, permissions and code signatures intact
          # (plain `zip` can corrupt the .app bundle).
          ditto -c -k --sequesterRsrc --keepParent "$app" LiteRT-Super-App-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: LiteRT-Super-App-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # Re-running for the same tag replaces the assets instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
